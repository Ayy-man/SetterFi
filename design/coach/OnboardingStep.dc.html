<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;450;500;540;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      /* Lifted verbatim from src/app/tokens.css, bare :root block (the light palette). */
      --canvas: oklch(0.9612 0.0042 262);
      --pane: oklch(0.9745 0.0034 262);
      --pane-bloom: radial-gradient(85% 50% at 78% -8%, rgba(46, 92, 200, 0.06), rgba(46, 92, 200, 0) 60%);
      --card-top: oklch(0.9975 0.0016 262);
      --card: oklch(0.9905 0.0026 262);
      --well: oklch(0.983 0.0048 262);
      --raised: var(--card-top);
      --band: rgba(60, 90, 150, 0.1);
      --row-hover: rgba(60, 90, 150, 0.035);
      --control-fill: rgba(28, 42, 82, 0.035);
      --line: rgba(60, 90, 150, 0.13);
      --line-soft: rgba(60, 90, 150, 0.06);
      --line-input: rgba(60, 90, 150, 0.15);
      --ink: oklch(0.2325 0.023 262);
      --body: oklch(0.2905 0.032 262);
      --muted: oklch(0.3604 0.036 262);
      --faint: oklch(0.4349 0.039 262);
      --accent: oklch(0.5 0.15 264);
      --accent-fill: linear-gradient(180deg, oklch(0.523 0.148 266), oklch(0.443 0.152 261));
      --accent-hover: oklch(0.455 0.158 264);
      --accent-line: rgba(46, 92, 200, 0.32);
      --accent-text: oklch(0.44 0.165 264);
      --accent-wash: rgba(46, 92, 200, 0.07);
      --accent-wash-strong: rgba(46, 92, 200, 0.1);
      --accent-edge: rgba(46, 92, 200, 0.22);
      --on-accent: oklch(0.99 0.003 267);
      --focus-ring: oklch(0.47 0.16 264 / 0.65);
      --good: oklch(0.6237 0.095 164);
      --good-text: oklch(0.4992 0.09 164);
      --good-wash: rgba(36, 132, 96, 0.09);
      --good-line: rgba(36, 132, 96, 0.26);
      --warning: oklch(0.6409 0.115 71);
      --warning-text: oklch(0.5183 0.105 71);
      --warning-body: oklch(0.47 0.045 80);
      --warning-wash: rgba(176, 116, 32, 0.1);
      --warning-line: rgba(176, 116, 32, 0.28);
      --waiting: oklch(0.6398 0.115 271);
      --waiting-text: oklch(0.5152 0.105 271);
      --waiting-wash: rgba(92, 110, 196, 0.09);
      --waiting-line: rgba(92, 110, 196, 0.26);
      --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 1px 2px rgba(28, 42, 82, 0.04), 0 8px 20px -14px rgba(28, 42, 82, 0.16);
      --shadow-raised: 0 1px 2px rgba(28, 42, 82, 0.06), 0 10px 26px -10px rgba(28, 42, 82, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      /* Canvas-only: the one drenched panel a coach screen may carry. Deep blue on the accent hue,
         so it is the same family as --accent without being the accent fill a button spends. */
      --drench: linear-gradient(158deg, oklch(0.36 0.1 264), oklch(0.27 0.075 266));
      --on-drench: oklch(0.99 0.003 267);
      --on-drench-muted: rgba(255, 255, 255, 0.78);
      --drench-line: rgba(255, 255, 255, 0.16);
      --primary-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 8px 20px -8px var(--accent);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--body); font-family: "Archivo", system-ui, sans-serif; font-size: 16px; font-weight: 450; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent-text); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 3px; }
    a.pill:hover, a.btn:hover, a.tab:hover { text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums lining-nums; }
    svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    svg.i24 { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    table { border-collapse: collapse; width: 100%; }

  </style>
</helmet>
<div style="position: relative; min-height: 894px; background: var(--canvas);">
  <!-- Top chrome: mark and product name, the setup title where the pill bar sits on the console,
       then the context eye at coach scale, the bell and the account chip. -->
  <div style="display: flex; align-items: center; gap: 32px; height: 76px; padding: 0 40px; border-bottom: 1px solid var(--line); background: var(--pane); flex: none;">
    <div style="display: flex; align-items: center; gap: 12px; width: 250px; flex: none;">
      <div style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--accent-edge); background: var(--accent-wash); color: var(--accent-text);">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.014em; color: var(--ink);">Your agent</span>
    </div>
    <div style="display: flex; justify-content: center; flex-grow: 1;">
      <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink);">Setup</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; width: 250px; flex: none;">
      <button aria-label="What this page shows" style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--well); color: var(--muted);">
        <svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button aria-label="Notifications" style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--well); color: var(--muted);">
        <svg class="i" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button style="display: flex; align-items: center; gap: 11px; height: 46px; padding: 0 14px 0 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--well); color: var(--ink);">
        <span class="mono" style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--accent-wash); border: 1px solid var(--accent-edge); color: var(--accent-text); font-size: 14px;">RF</span>
        <span style="font-size: 16px; font-weight: 500; color: var(--ink);">Reid</span>
        <svg class="i" viewBox="0 0 24 24" style="width: 17px; height: 17px; color: var(--faint);"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </div>
  <div style="padding: 36px 40px 96px; background-image: var(--pane-bloom);">
    <div style="width: 100%; max-width: 720px; margin: 0 auto;">

      <!-- The step rail collapsed to a line. Not pressable, so it needs no target height. -->
      <div aria-hidden="true" style="display: flex; gap: 6px; width: 100%;"><span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: var(--accent);"></span><span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: var(--line);"></span><span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: var(--line);"></span><span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: var(--line);"></span><span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: var(--line);"></span><span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: var(--line);"></span></div>

      <div style="margin: 24px 0 32px;">
        <p style="margin-bottom: 8px; font-size: 16px; color: var(--muted);">Step 1 of 6</p>
        <h1 style="margin-bottom: 12px; font-size: 46px; font-weight: 600; letter-spacing: -0.026em; line-height: 1.05; color: var(--ink);">Your business profile</h1>
        <p style="font-size: 17px; line-height: 1.5; color: var(--body);">Your agent says these words to your leads, so write them the way you would say them.</p>
      </div>

      <div style="display: flex; flex-direction: column; border-radius: 24px 24px 17px 17px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--card-top), var(--card)); box-shadow: var(--shadow-card); overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 24px 20px;">
        <div style="min-width: 0; ">
          <label style="display: block; margin-bottom: 6px; font-size: 16px; color: var(--muted);">What is your business called?</label>
          <div style="display: flex; align-items: center; min-height: 48px; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line-input); background: var(--well); font-size: 16px; line-height: 1.5; color: var(--ink);">Reid Funding</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
          <div style="min-width: 0; ">
          <label style="display: block; margin-bottom: 6px; font-size: 16px; color: var(--muted);">City</label>
          <div style="display: flex; align-items: center; min-height: 48px; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line-input); background: var(--well); font-size: 16px; line-height: 1.5; color: var(--ink);">Charlotte</div>
        </div>
          <div style="min-width: 0; ">
          <label style="display: block; margin-bottom: 6px; font-size: 16px; color: var(--muted);">State</label>
          <div style="display: flex; align-items: center; min-height: 48px; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line-input); background: var(--well); font-size: 16px; line-height: 1.5; color: var(--ink);">North Carolina</div>
        </div>
        </div>
        <div style="min-width: 0; ">
          <label style="display: block; margin-bottom: 6px; font-size: 16px; color: var(--muted);">What do you help people with?</label>
          <div style="display: flex; align-items: center; min-height: 48px; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line-input); background: var(--well); font-size: 16px; line-height: 1.5; color: var(--ink);">Business credit and funding for owners who have been turned down by a bank.</div>
        </div>
        <div style="min-width: 0; ">
          <label style="display: block; margin-bottom: 6px; font-size: 16px; color: var(--muted);">A phone number leads can call</label>
          <div style="display: flex; align-items: center; min-height: 48px; padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line-input); background: var(--well); font-size: 16px; line-height: 1.5; color: var(--faint);">Add a number</div>
        </div>
      </div>
  </div>

      <!-- One filled button, one plain way out. Both wrap rather than overflow. -->
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 32px;">
        <button style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 24px; border-radius: 9px; border: 1px solid var(--accent-line); background: var(--accent-fill); color: var(--on-accent); font-size: 16px; font-weight: 600; box-shadow: var(--primary-shadow); white-space: nowrap; ">Continue to connecting</button>
        <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; margin: -10px 0; padding: 0 2px; font-size: 16px; ">Save and finish later</a>
      </div>
    </div>
  </div>
  <!-- Support bubble: 56px, ink not accent, so it never competes with the page's one filled button. -->
  <button aria-label="Message support" style="position: absolute; right: 32px; bottom: 32px; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.12); background: var(--ink); color: var(--on-accent); box-shadow: var(--shadow-raised);">
    <svg class="i24" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>
</div>
</x-dc>
</body>
</html>
